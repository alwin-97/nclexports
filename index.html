<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCL Exports - Coming Soon</title>
    <link rel="icon" type="image/x-icon" href="assets/logo.png">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d1117;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e6edf3;
            text-align: center;
            padding: 2rem;
        }

        .container {
            max-width: 600px;
        }

        .logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
            color: #ffffff;
        }

        .tagline {
            font-size: 1.1rem;
            color: #8b949e;
            margin-bottom: 2.5rem;
        }

        .badge {
            display: inline-block;
            background: rgba(56, 139, 253, 0.15);
            border: 1px solid rgba(56, 139, 253, 0.4);
            color: #58a6ff;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 0.45rem 1.4rem;
            border-radius: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="assets/logo.png" alt="NCL Exports Logo" class="logo">
        <h1>NCL Exports</h1>
        <p class="tagline">Something great is on its way.</p>
        <span class="badge">Coming Soon</span>
    </div>
</body>
</html>
