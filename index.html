<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="NCL Exports — connecting Kerala to the world.">
  <title>NCL Exports</title>
  <style>
    :root {
      --navy: #06162e;
      --blue: #0a3b68;
      --sky: #43b8ee;
      --white: #f7fbff;
      --muted: #b6c8db;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--white);
      background: var(--navy);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      background-image:
        linear-gradient(90deg, rgba(3, 15, 34, .98) 0%, rgba(3, 18, 39, .9) 36%, rgba(5, 27, 53, .38) 70%, rgba(3, 14, 31, .58) 100%),
        linear-gradient(0deg, rgba(2, 12, 27, .93) 0%, transparent 44%),
        url("assets/img/image.png");
      background-size: cover;
      background-position: center;
    }

    .page::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 30rem;
      height: 30rem;
      left: -12rem;
      top: -11rem;
      border-radius: 50%;
      background: rgba(25, 158, 224, .17);
      filter: blur(50px);
    }

    .shell {
      width: min(1180px, calc(100% - 48px));
      margin-inline: auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 13px;
      color: inherit;
      text-decoration: none;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 45px;
      height: 45px;
      border: 1px solid rgba(255, 255, 255, .26);
      border-radius: 14px;
      color: var(--sky);
      background: rgba(5, 33, 62, .66);
      box-shadow: inset 0 0 24px rgba(60, 184, 240, .12);
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: -.08em;
      backdrop-filter: blur(12px);
    }

    .brand-text { display: grid; gap: 1px; }
    .brand-name { font-size: 1rem; font-weight: 750; letter-spacing: .13em; }
    .brand-sub { color: var(--muted); font-size: .65rem; letter-spacing: .28em; text-transform: uppercase; }

    .top-link {
      color: var(--white);
      text-decoration: none;
      font-size: .83rem;
      font-weight: 650;
      letter-spacing: .04em;
      padding: 11px 18px;
      border: 1px solid rgba(255, 255, 255, .28);
      border-radius: 999px;
      background: rgba(5, 28, 52, .5);
      backdrop-filter: blur(10px);
      transition: border-color .2s, background .2s;
    }

    .top-link:hover { border-color: var(--sky); background: rgba(14, 81, 124, .65); }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 72px 0 115px;
    }

    .hero { max-width: 690px; }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 22px;
      color: #71cff7;
      font-size: .72rem;
      font-weight: 750;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .eyebrow::before { content: ""; width: 36px; height: 1px; background: currentColor; }

    h1 {
      max-width: 660px;
      margin: 0;
      font-size: clamp(3.25rem, 8vw, 6.9rem);
      line-height: .9;
      letter-spacing: -.065em;
      text-wrap: balance;
    }

    h1 span {
      display: block;
      color: transparent;
      background: linear-gradient(100deg, #dff5ff, #55bce9 72%);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .intro {
      max-width: 520px;
      margin: 27px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.7vw, 1.15rem);
      line-height: 1.7;
    }

    .contacts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      width: min(920px, calc(100% - 48px));
      margin: auto auto 32px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .17);
      border-radius: 18px;
      background: rgba(255, 255, 255, .14);
      box-shadow: 0 22px 65px rgba(0, 0, 0, .24);
      backdrop-filter: blur(18px);
    }

    .contact {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      padding: 19px 22px;
      color: inherit;
      text-decoration: none;
      background: rgba(4, 25, 48, .82);
      transition: background .2s;
    }

    a.contact:hover { background: rgba(10, 61, 97, .88); }

    .icon {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 39px;
      height: 39px;
      border-radius: 12px;
      color: #83d7fb;
      background: rgba(72, 185, 234, .12);
    }

    .icon svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; }
    .contact-copy { min-width: 0; display: grid; gap: 4px; }
    .label { color: #829bb2; font-size: .64rem; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; }
    .value { overflow: hidden; text-overflow: ellipsis; font-size: .86rem; font-weight: 600; white-space: nowrap; }

    @media (max-width: 760px) {
      .page { background-position: 60% center; }
      .shell { width: min(100% - 32px, 1180px); }
      header { padding-top: 20px; }
      .top-link { display: none; }
      main { align-items: flex-start; padding: 88px 0 80px; }
      h1 { font-size: clamp(3.35rem, 16vw, 5.4rem); }
      .intro { max-width: 390px; }
      .contacts { grid-template-columns: 1fr; width: calc(100% - 32px); margin-bottom: 16px; }
      .contact { padding: 15px 18px; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .hero > * { animation: rise .75s both; }
      .hero h1 { animation-delay: .08s; }
      .hero .intro { animation-delay: .16s; }
      .contacts { animation: rise .75s .24s both; }
      @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="shell">
      <a class="brand" href="#" aria-label="NCL Exports home">
        <span class="mark" aria-hidden="true">NCL</span>
        <span class="brand-text">
          <span class="brand-name">NCL EXPORTS</span>
          <span class="brand-sub">Kerala, India</span>
        </span>
      </a>
      <a class="top-link" href="mailto:contact@nclexports.com">Contact us</a>
    </header>

    <main class="shell">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">Ernakulam · Kerala</p>
        <h1 id="page-title">Connecting Kerala <span>to the world.</span></h1>
        <p class="intro">NCL Exports brings people and markets closer across borders.</p>
      </section>
    </main>

    <address class="contacts" aria-label="Contact details">
      <a class="contact" href="mailto:contact@nclexports.com">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 6.5h18v11H3z"/><path d="m3.5 7 8.5 6 8.5-6"/></svg></span>
        <span class="contact-copy"><span class="label">General</span><span class="value">contact@nclexports.com</span></span>
      </a>
      <a class="contact" href="mailto:amal@nclexports.com">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 6.5h18v11H3z"/><path d="m3.5 7 8.5 6 8.5-6"/></svg></span>
        <span class="contact-copy"><span class="label">Direct</span><span class="value">amal@nclexports.com</span></span>
      </a>
      <a class="contact" href="tel:+917902298008">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 3 5 4.5c-.8.4-1.2 1.3-.9 2.1 2.1 6.2 7.1 11.2 13.3 13.3.8.3 1.7-.1 2.1-.9l1.5-3-5-2-1.1 2.2a16 16 0 0 1-7.1-7.1L10 8z"/></svg></span>
        <span class="contact-copy"><span class="label">Phone</span><span class="value">+91 79022 98008</span></span>
      </a>
      <div class="contact">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
        <span class="contact-copy"><span class="label">Location</span><span class="value">Ernakulam, Kerala</span></span>
      </div>
    </address>
  </div>
</body>
</html>
